model:
  benchmark: VNINDEX
  # Full historical start is for explicit backtests/backfills.
  history_start: '2018-01-01'
  # Daily production only needs enough observations for MA200 / 52-week high.
  live_lookback_days: 520
  # Current HOSE/HNX/UPCOM groups are screened by live trading value first;
  # only the most liquid 200 names need full historical OHLCV during bootstrap; daily runs then use the persistent cache.
  live_max_symbols: 200
  sector_level: 2            # ICB supersector: broad enough for stable breadth/rotation
  min_price: 3.0              # thousand VND/share
  min_avg_value_20: 10000000000  # 10bn VND/day
  min_history_days: 130
  acceleration_window: 5
  coverage_reference_days: 30
  min_cross_section_coverage: 0.70
  min_cross_section_stocks: 50

weights:
  relative_strength:
    rs_5: 0.15
    rs_20: 0.30
    rs_60: 0.35
    rs_sector_20: 0.20
  # V4 challenger grounded in residual/industry/path-quality momentum research.
  # These are starting research weights; production trust comes from OOS tests,
  # not from treating the weights as academic constants.
  real_strength:
    residual_mom_60: 0.25
    residual_mom_120: 0.15
    rs_sector_60: 0.20
    rs_persistence_count: 0.15
    path_quality_60: 0.15
    near_52w_high: 0.10
  flow:
    value_ratio_20: 0.35
    volume_ratio_20: 0.25
    turnover_proxy_accel_20: 0.20
    up_volume_share_20: 0.20
  trend:
    ma20_distance: 0.20
    ma50_distance: 0.15
    ma20_slope_5: 0.20
    ma50_slope_10: 0.15
    high_252_proximity: 0.15
    positive_day_share_20: 0.10
    volatility_20: -0.05
  sector:
    sector_rs_20: 0.30
    sector_rs_60: 0.25
    breadth_ma20: 0.20
    breadth_ma50: 0.10
    sector_value_ratio_20: 0.15
  leadership:
    rs_score: 0.35
    flow_score: 0.25
    trend_score: 0.20
    sector_score: 0.20
  short_momentum:
    rs_5: 0.25
    rs_20: 0.25
    value_ratio_20: 0.20
    volume_ratio_20: 0.10
    ma20_slope_5: 0.10
    positive_day_share_20: 0.10
  long_momentum:
    rs_60: 0.30
    rs_120: 0.20
    ma50_distance: 0.15
    ma50_slope_10: 0.15
    high_252_proximity: 0.10
    positive_day_share_20: 0.10

opportunities:
  short_threshold: 80
  long_threshold: 80
  min_sector_score: 50
  portfolio_size: 10
  portfolio_sector_cap: 2
  entry_model_version: v4-vol-adaptive-2026-09-21
  entry_top_n: 3
  entry_min_sector_score: 55
  entry_min_leadership_score: 70
  entry_min_short_score: 65
  entry_min_long_score: 70
  entry_min_real_strength_score: 70
  entry_min_rs_persistence: 2
  entry_require_residual_momentum: true
  entry_require_macd_positive: true
  entry_require_medium_trend: true
  entry_require_weekly_trend: true
  # Volatility-local anti-chase. These are absolute ceilings; each ticker gets
  # a tighter or wider local band from its own trailing ATR.
  entry_adaptive_volatility: true
  entry_max_ma20_distance: 0.10
  entry_max_ret5: 0.15
  entry_max_age_sessions: 2
  entry_max_distance_from_entry: 0.10
  entry_pullback_atr_multiple: 0.75
  entry_ma20_atr_multiple: 1.50
  entry_ret5_atr_multiple: 3.00
  entry_candidate_distance_atr_multiple: 1.50
  entry_min_local_ma20_cap: 0.03
  entry_min_local_ret5_cap: 0.05
  entry_max_pullback_band: 0.04
  entry_squeeze_bonus: 5
  entry_pullback_bonus: 3

risk_management:
  # Volatility-adaptive risk. ATR is measured on the signal date so all levels
  # are known before the T+1 fill. Floors/caps prevent absurdly tight/wide risk.
  adaptive_volatility: true
  hard_stop_pct: 0.05          # fallback only when ATR is unavailable
  stop_atr_multiple: 2.00
  use_structural_stop: true
  structure_buffer_atr: 0.25
  min_stop_pct: 0.05
  max_stop_pct: 0.12
  reference_position_stop_pct: 0.05
  profit_arm_r: 1.50
  min_profit_arm_pct: 0.10
  max_profit_arm_pct: 0.22
  profit_floor_r: 0.30
  min_profit_floor_pct: 0.02
  max_profit_floor_pct: 0.06
  peak_trail_pct: 0.08         # fallback only when ATR is unavailable
  trail_atr_multiple: 2.50
  min_trail_pct: 0.08
  max_trail_pct: 0.18
  strength_break_votes: 2
  strength_real_floor: 60
  strength_leadership_floor: 60
  strength_trend_floor: 55

stages:
  leader_score: 85
  mature_score: 90
  emerging_min_score: 65
  emerging_acceleration: 10
  fading_acceleration: -10
  fading_score: 60
