model:
  benchmark: VNINDEX
  # Full historical start is for explicit backtests/backfills.
  history_start: '2018-01-01'
  # Daily production only needs enough observations for MA200 / 52-week high.
  live_lookback_days: 520
  # Current HOSE/HNX/UPCOM groups are screened by live trading value first;
  # only the most liquid 200 names need full historical OHLCV during bootstrap; daily runs then use the persistent cache.
  live_max_symbols: 200
  sector_level: 2            # ICB supersector: broad enough for stable breadth/rotation
  min_price: 3.0              # thousand VND/share
  min_avg_value_20: 10000000000  # 10bn VND/day
  min_history_days: 130
  acceleration_window: 5
  coverage_reference_days: 30
  min_cross_section_coverage: 0.70
  min_cross_section_stocks: 50

weights:
  relative_strength:
    rs_5: 0.15
    rs_20: 0.30
    rs_60: 0.35
    rs_sector_20: 0.20
  flow:
    value_ratio_20: 0.35
    volume_ratio_20: 0.25
    turnover_proxy_accel_20: 0.20
    up_volume_share_20: 0.20
  trend:
    ma20_distance: 0.20
    ma50_distance: 0.15
    ma20_slope_5: 0.20
    ma50_slope_10: 0.15
    high_252_proximity: 0.15
    positive_day_share_20: 0.10
    volatility_20: -0.05
  sector:
    sector_rs_20: 0.30
    sector_rs_60: 0.25
    breadth_ma20: 0.20
    breadth_ma50: 0.10
    sector_value_ratio_20: 0.15
  leadership:
    rs_score: 0.35
    flow_score: 0.25
    trend_score: 0.20
    sector_score: 0.20
  short_momentum:
    rs_5: 0.25
    rs_20: 0.25
    value_ratio_20: 0.20
    volume_ratio_20: 0.10
    ma20_slope_5: 0.10
    positive_day_share_20: 0.10
  long_momentum:
    rs_60: 0.30
    rs_120: 0.20
    ma50_distance: 0.15
    ma50_slope_10: 0.15
    high_252_proximity: 0.10
    positive_day_share_20: 0.10

opportunities:
  short_threshold: 80
  long_threshold: 80
  min_sector_score: 50
  portfolio_size: 10
  portfolio_sector_cap: 2
  entry_model_version: v2-causal-2026-09-20
  entry_top_n: 3
  entry_min_sector_score: 50
  entry_min_leadership_score: 65
  entry_min_short_score: 65
  entry_min_long_score: 55
  entry_short_cross_threshold: 80
  entry_require_macd_positive: true
  entry_require_ma_bull: true
  # Anti-chase gates: an entry setup expires once price is too stretched.
  entry_max_ma20_distance: 0.15
  entry_max_ret5: 0.18
  entry_max_age_sessions: 3
  entry_max_distance_from_entry: 0.08
  entry_ma_cross_bonus: 4
  entry_bb_breakout_bonus: 6

stages:
  leader_score: 85
  mature_score: 90
  emerging_min_score: 65
  emerging_acceleration: 10
  fading_acceleration: -10
  fading_score: 60
