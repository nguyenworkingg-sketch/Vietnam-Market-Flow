name: Daily Market Flow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'outputs/**'
      - 'docs/**'
      - 'data/**'
  schedule:
    # 09:25 UTC = 16:25 Vietnam time, Mon-Fri
    - cron: '25 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: daily-market-flow-${{ github.ref }}
  # During development this prevents dozens of obsolete push smoke runs from
  # blocking the newest code. Daily output commits are path-ignored.
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -q

  smoke-live:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[run-full]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_TELEMETRY: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Vnstock live smoke test
        run: python scripts/run_daily.py --provider vnstock --symbols FPT,VCB,GAS,POW --start 2026-01-01
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-dashboard
          path: |
            outputs/dashboard.html
            outputs/scores_latest.csv
            outputs/market_regime.csv

  daily:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-full]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VNSTOCK_TELEMETRY: off
    steps:
      - uses: actions/checkout@v4
      - name: Validate production secrets
        run: |
          test -n "$VNSTOCK_API_KEY" || (echo 'Missing VNSTOCK_API_KEY' && exit 1)
          test -n "$SUPABASE_URL" || (echo 'Missing SUPABASE_URL' && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Missing SUPABASE_SERVICE_ROLE_KEY' && exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build daily signals
        run: python scripts/run_daily.py --provider vnstock
      - name: Validate production data quality
        run: python scripts/validate_output.py
      - name: Run rolling research diagnostics
        run: python scripts/run_backtest.py
      - name: Commit dashboard outputs
        run: |
          git config user.name 'market-flow-bot'
          git config user.email 'market-flow-bot@users.noreply.github.com'
          git add outputs/ docs/
          git diff --cached --quiet || git commit -m 'chore: daily market-flow update'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: market-flow-${{ github.run_id }}
          path: |
            outputs/dashboard.html
            outputs/scores_latest.csv
            outputs/market_regime.csv
            outputs/opportunities_short_latest.csv
            outputs/opportunities_long_latest.csv
            outputs/model_portfolio_10.csv
            outputs/top3_entry_candidates.csv
            outputs/top3_entry_watchlist.csv
            outputs/entry_signal_history.csv
            outputs/entry_signal_audit.csv
            outputs/entry_lifecycle_audit.csv
            outputs/position_monitor.csv
            outputs/risk_stop_sensitivity.csv
            outputs/risk_policy_comparison.csv
            outputs/backtest/
